# Fonts
font_family monospace
font_size 13.0
disable_ligatures always
text_composition_strategy 1.5 0

# Cursor customization
cursor_shape beam

# Scrollback
scrollback_lines 10000

# Mouse
copy_on_select yes
strip_trailing_spaces always
select_by_word_characters :@-./_~?&=%+#

# Window layout
remember_window_size  no
initial_window_width  160c
initial_window_height 54c
enabled_layouts Tall, Fat, Grid, Stack
window_border_width 1.0pt
window_padding_width 12 12
confirm_os_window_close 0

# Window management
map kitty_mod+enter new_window_with_cwd
map cmd+enter       new_window_with_cwd

# Tab management
map kitty_mod+t new_tab_with_cwd
map cmd+t       new_tab_with_cwd

# Layout management
map kitty_mod+; toggle_layout stack

# Hints
action_alias myhints kitten hints
\ --hints-foreground-color bright-white
\ --hints-background-color bright-black

map kitty_mod+p>f myhints --type path --program -
map kitty_mod+p>g myhints --type path
map kitty_mod+p>l myhints --type line --program -
map kitty_mod+p>w myhints --type word --program -
map kitty_mod+p>h myhints --type hash --program -
map kitty_mod+p>n myhints --type linenum
map kitty_mod+p>y myhints --type hyperlink

map kitty_mod+/
\ launch --location=hsplit --allow-remote-control
\ kitty +kitten kitty_search/search.py @active-kitty-window-id
