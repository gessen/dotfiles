[build]
rustflags = [
  "-Clink-arg=-fuse-ld=mold",
  "-Clink-arg=-Wl,--compress-debug-sections=zstd",
  "-Clink-arg=-Wl,-rpath,/opt/openssl/lib",
]
rustdocflags = [
  "-Clink-arg=-Wl,-rpath,/opt/openssl/lib",
]
rustc-wrapper = "kache"

[env]
HOST_CC = "kache cc"
HOST_CXX = "kache c++"
CC_KNOWN_WRAPPER_CUSTOM = "kache"
LIBCXX_INSTALL_PATH = "/opt/libc++"
OPENSSL_INSTALL_PATH = "/opt/openssl"
V8_INSTALL_PATH = "/opt/v8"

[profile.dev]
split-debuginfo = "packed"

[profile.deploy]
inherits = "dev"
debug = "line-tables-only"
split-debuginfo = "off"

[profile.deploy.package."*"]
debug = false
